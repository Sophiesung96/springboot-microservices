version: "3.8"

services:

  #rabbit:
  #image: "rabbitmq:3.12-management"
  #container_name: rabbitmq-ms
  #hostname: rabbitmq
  #ports:
  #- "5672:5672"
  #- "15672:15672"
  #healthcheck:
  #test: rabbitmq-diagnostics check_port_connectivity
  #interval: 10s
  #timeout: 5s
  #retries: 10
  #start_period: 5s
  #networks:
  #- eazybank



  configserver:
    image: "sophie86/microservices-configserver:1.0.1"
    container_name: configserver-ms
    ports:
      - "8071:8071"
    depends_on:
      rabbit:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m
    healthcheck:
      test: [ "CMD-SHELL", "curl http://localhost:8071/actuator/health || exit /b 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - eazybank


  accounts:
    image: "sophie86/microservices-accounts:2.0.1"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    depends_on:
      accountsdb:
        condition: service_healthy
      configserver:
        condition: service_healthy

    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank

    environment:
      SPRING_APPLICATION_NAME: accounts
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default

  cards:
    image: "sophie86/microservices-cards:2.0.1"
    container_name: cards-ms
    ports:
      - "8090:8090"
    depends_on:
      accountsdb:
        condition: service_healthy
      configserver:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank

    environment:
      SPRING_APPLICATION_NAME: cards
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default

  loans:
    image: "sophie86/microservices-loans:2.0.1"
    container_name: loans-ms
    depends_on:
      configserver:
        condition: service_healthy
      accountsdb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 700m
    ports:
      - "9000:9000"
    networks:
      - eazybank
    environment:
      SPRING_APPLICATION_NAME: loans
      SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
      SPRING_PROFILES_ACTIVE: default



networks:
  eazybank:
    driver: "bridge"

