version: "3.8"

services:
  accounts:
    image: "sophie86/microservices-accounts:1"
    container_name: accounts-ms
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank

  cards:
    image: "sophie86/microservices-cards:2"
    container_name: cards-ms
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank


  loans:
    image: "sophie86/microservices-loans:2"
    container_name: loans-ms
    deploy:
      resources:
        limits:
          memory: 700m
    ports:
      - "9000:9000"
    networks:
      - eazybank

networks:
  eazybank:
    driver: "bridge"

